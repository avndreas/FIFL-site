<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Food Industry Fabrication Ltd.</title>
  <meta name="description" content="Contact Food Industry Fabrication Ltd. — phone, email, location, and enquiry form.">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ===== HEADER — generated from partials/header.html · DO NOT EDIT ===== -->
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html" aria-label="Food Industry Fabrication Ltd. — Home">
        <!-- Placeholder logo mark, inlined so it inherits the theme.css colours.
             An <img src="*.svg"> renders in its own document and cannot see them. -->
        <svg class="brand__logo" viewBox="0 0 64 64" width="40" height="40"
             aria-hidden="true" focusable="false">
          <rect width="64" height="64" fill="var(--color-primary)"/>
          <rect x="6" y="6" width="52" height="52" fill="none"
                stroke="var(--color-text-invert)" stroke-width="3"/>
          <g fill="var(--color-text-invert)">
            <path d="M32 16l3 4 5-1 1 5 4 3-3 4 3 4-4 3-1 5-5-1-3 4-3-4-5 1-1-5-4-3 3-4-3-4 4-3 1-5 5 1z"/>
            <circle cx="32" cy="32" r="7" fill="var(--color-accent)"/>
          </g>
          <text x="32" y="37" font-family="Arial, sans-serif" font-size="11" font-weight="700"
                text-anchor="middle" fill="var(--color-text-invert)">FIFL</text>
        </svg>
        <span class="brand__name">Food Industry<br><span>Fabrication</span> Ltd.</span>
      </a>

      <!-- Three-bar menu button. Shown only below 820px, where the brand and the
           five tabs no longer fit one row (see css/base.css § MOBILE MENU).

           It ships with `hidden` and is revealed by js/nav.js. That way a browser
           with JavaScript disabled never sees a button that cannot do anything —
           it falls back to the plain, always-visible nav below. -->
      <button class="nav-toggle" type="button" hidden
              aria-label="Menu" aria-expanded="false" aria-controls="primary-nav">
        <svg class="nav-toggle__icon" viewBox="0 0 24 24" width="24" height="24"
             aria-hidden="true" focusable="false">
          <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <nav class="main-nav" id="primary-nav" aria-label="Primary">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <!-- ===== /HEADER ===== -->

  <main id="main">
    <section class="section">
      <div class="container">
        <h1 class="section__title">Contact</h1>

        <div class="contact-grid">

          <!-- Enquiry form.
               NOTE: placeholder only — this form does not submit anywhere yet.
               Wire up an "action" to a form handler (Netlify Forms, Formspree, etc.)
               or a serverless endpoint. See SITE-SPEC.md section 6. -->
          <form class="contact-form" aria-label="Contact enquiry form">
            <div class="form-field">
              <label for="name">Your name</label>
              <input type="text" id="name" name="name" autocomplete="name" required>
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="form-field">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" autocomplete="tel">
            </div>
            <div class="form-field">
              <label for="message">Message</label>
              <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn">Send enquiry</button>
          </form>

          <!-- Contact details + map -->
          <div>
            <ul class="contact-details">
              <li><strong>Email</strong> info@example.com <!-- placeholder --></li>
              <li><strong>Phone</strong> +1 000 000 0000 <!-- placeholder --></li>
              <li><strong>Address</strong> 45 Lancing Dr, Hamilton, ON L8W 2Z9 </li>
            </ul>

            <!-- Google Maps embed, keyed off the address in .contact-details above.
                 The `?q=<address>&output=embed` form needs no API key and no billing
                 account — Google geocodes the query string on its end. If the pin ever
                 needs to be more precise than the street address (a specific unit or
                 loading bay), swap `q=` for the exact `lat,lng`.

                 The alternatives, for the record:
                 - Maps > Share > Embed a map gives a `/maps/embed?pb=...` URL. That `pb`
                   token is opaque and only Google's UI can mint it, so it has to be
                   pasted in by hand from a browser — it can't be constructed here.
                 - The official Maps Embed API (`/maps/embed/v1/place`) is the documented,
                   supported endpoint, but it requires a Google Cloud API key that would
                   be public in this markup and so needs an HTTP-referrer restriction.
                 loading="lazy" keeps the map off the critical path. -->
            <div class="map-embed">
              <iframe
                src="https://www.google.com/maps?q=45+Lancing+Dr,+Hamilton,+ON+L8W+2Z9&amp;z=11&amp;output=embed"
                title="Map showing Food Industry Fabrication Ltd. at 45 Lancing Dr, Hamilton, ON L8W 2Z9"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                allowfullscreen></iframe>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER — generated from partials/footer.html · DO NOT EDIT ===== -->
  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>&copy; 2026 Food Industry Fabrication Ltd. All rights reserved.</p>
      <p><a href="contact.html">Contact us</a></p>
    </div>
  </footer>
  <!-- ===== /FOOTER ===== -->

  <script src="js/prefetch.js" defer></script>
  <script src="js/nav.js" defer></script>
</body>
</html>
